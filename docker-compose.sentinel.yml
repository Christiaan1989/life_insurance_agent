services:
  sentinel_postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
      POSTGRES_DB: sentinel_life_db
    ports:
      - "5433:5432"
    volumes:
      - sentinel_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel_life_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  sentinel_api:
    build:
      context: ./sentinel_backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://sentinel:sentinel@sentinel_postgres:5432/sentinel_life_db
      API_KEY: sentinel-api-key-2025
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-onboarding@resend.dev}
      DEMO_OTP_EMAIL: christiaanbecker9@icloud.com
    ports:
      - "8001:8000"
    depends_on:
      sentinel_postgres:
        condition: service_healthy

volumes:
  sentinel_pgdata:
